name: 'Compile'

on:
  workflow_dispatch

jobs:
  build:
    name: Build
    runs-on: [ubuntu-latest]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v6      
        with:
          node-version: "22.x"
      - run: |
         npm run compile

      - name: Upload Distributable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: |
            ./dist
          retention-days: 2
